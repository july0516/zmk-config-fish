# キーボードの設定をカスタマイズする
# 項目は https://zmk.dev/docs/config/... を参照

# ディープスリープを使わない（使う場合は y にする。復帰には数秒かかり、復帰時に押したキーは入力されない）
CONFIG_ZMK_SLEEP=n
# ディープスリープを使う場合、15分放置でスリープ（上を y にした時だけ有効にする）
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Bluetooth接続を安定化
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# マウスポインターキーを使う（効かなそう？）
# CONFIG_ZMK_POINTING=y