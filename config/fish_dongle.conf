# Eyelash ドングル（親機）の設定
# 項目は https://zmk.dev/docs/config を参照

# 左右2台の子機をつなぐ
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
# パソコン用プロファイル5つ + 子機2台
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# 子機の電池残量を取得して画面に表示する
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# OLED
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
# OLEDの電源（nice!nano の VCC 制御）
CONFIG_ZMK_EXT_POWER=y

# ドングルはディープスリープしない
# （ドングルにはキーが無く、スリープすると押して起こす手段がないため。
#   USB給電中はどのみちスリープしない）
CONFIG_ZMK_SLEEP=n

# 電波を強めにする
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 画面にドングル自身の電池残量も出す（電池で使う時のため）
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
# 修飾キーをMacの記号で表示する場合
# CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
