# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # ドングルなし（左が親機）
  - board: xiao_ble//zmk
    shield: fish_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: xiao_ble//zmk
    shield: fish_right
  - board: xiao_ble//zmk
    shield: settings_reset

  # Eyelash ドングルあり（ドングルが親機、左右は子機）
  # 右は上の fish_right をそのまま使う
  - board: nice_nano//zmk
    shield: fish_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: fish_dongle
  - board: xiao_ble//zmk
    shield: fish_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: fish_left_peripheral
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano
